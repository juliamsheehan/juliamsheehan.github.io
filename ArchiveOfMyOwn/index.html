function clean(el){el.querySelectorAll('script,iframe,object,embed,style,link').forEach(x=>x.remove());el.querySelectorAll('*').forEach(x=>[...x.attributes].forEach(a=>{if(/^on/i.test(a.name)||/^\s*javascript:/i.test(a.value))x.removeAttribute(a.name)}));el.querySelectorAll('p').forEach(p=>{if(!p.textContent.replace(/\u00a0/g,' ').trim()&&!p.children.length)p.remove()});return el.innerHTML}

 if(gs.length)gs.forEach(g=>{const c=g.nextElementSibling,e=c&&c.nextElementSibling,n=g.querySelector('blockquote'),eb=e&&e.classList.contains('meta')&&e.querySelector('blockquote');
  ch.push({title:g.querySelector('h2').textContent.replace(/\s+/g,' ').trim().replace(/^Chapter \d+:?\s*/i,''),notes:n?clean(n):'',html:clean(c),end:eb?clean(eb):''})});

async function load(){W=await all('works');COLS=await all('cols')}
const norm=x=>(x||'').toLowerCase().replace(/[^\p{L}\p{N}]+/gu,' ').trim();
const askDup=(m,d)=>new Promise(res=>{const same=d.id==m.id,o=h('div',{class:'ov'},h('div',{class:'md'},h('h3','Already in your library'),

 d.url?h('p',{},'Original: ',h('a',{href:d.url,target:'_blank',rel:'noopener'},d.url)):h('p',{class:'mut'},'No original link was saved.'),

async function imp(files){let n=0,sk=0,bad=[];const pool=[...W];
 if(GH()){try{const r=await gh('index.json',{raw:true});if(r)JSON.parse(r).forEach(x=>{if(!pool.some(y=>y.id==x.id))pool.push(x)})}catch(e){}}
 for(const f of files){try{const t=await f.text();
  if(/\.json$/i.test(f.name)){const j=JSON.parse(t);for(const w of j.works){await put('works',w);mark(w.id)}for(const x of j.text)await put('text',x);for(const c of j.cols||[])await put('cols',c);n+=j.works.length}
  else{const{meta,ch}=parse(t,f.name),old=W.find(x=>x.id==meta.id),dup=pool.find(x=>x.id==meta.id)||(norm(meta.title)&&norm(meta.author)?pool.find(x=>norm(x.title)==norm(meta.title)&&norm(x.author)==norm(meta.author)):null);
   if(dup&&!(await askDup(meta,dup))){sk++;continue}
   if(old){meta.added=old.added;meta.last=old.last}await put('works',meta);await put('text',{id:meta.id,ch});mark(meta.id);fresh.add(meta.id);pool.push(meta);n++}}catch(e){bad.push(f.name)}}

async function exp(){const f=new File([JSON.stringify({v:1,works:W,text:await all('text'),cols:COLS})],'fic-library-backup.json',{type:'application/json'});
 try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(e){}

/* ---------- github sync ---------- */
const GH_REPO='juliamsheehan/ArchiveOfMyOwn',GH_BRANCH='main';
const GH=()=>{const g=JSON.parse(ls('gh')||'null');return g&&g.token?{repo:GH_REPO,branch:GH_BRANCH,token:g.token}:null};
const b64=s=>{const b=new TextEncoder().encode(s);let o='';for(let i=0;i<b.length;i+=8192)o+=String.fromCharCode(...b.subarray(i,i+8192));return btoa(o)};
const hs=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].slice(0,8).map(b=>b.toString(16).padStart(2,'0')).join('');
async function gh(path,o={}){const g=GH(),m=o.method||'GET';
 const r=await fetch(path.startsWith('git/')?`https://api.github.com/repos/${g.repo}/${path}`:`https://api.github.com/repos/${g.repo}/contents/${path}${m=='GET'?'?ref='+encodeURIComponent(g.branch||'main'):''}`,{method:m,body:o.body&&JSON.stringify(o.body),headers:{Authorization:'Bearer '+g.token,Accept:o.raw?'application/vnd.github.raw+json':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'}});
 if(r.status==404&&m=='GET')return null;if(!r.ok)throw new Error(r.status+(r.status==401||r.status==403||r.status==404?' – check the repo name and token permissions':''));

let dirty=new Set(),cd=false,tm,sst='';
const stat=t=>{sst=t;const e=$('#sst');if(e)e.textContent=t};
function mark(id,col){const g=GH();if(!g||!g.token||ls('auto')=='0')return;if(id)dirty.add(id);if(col)cd=true;clearTimeout(tm);tm=setTimeout(flush,3000);stat('Sync pending…')}
async function flush(){const ids=[...dirty],c=cd;dirty.clear();cd=false;try{stat('Syncing to GitHub…');for(const id of ids){await ghPush(id);if(fresh.has(id)){fresh.delete(id);const w=W.find(x=>x.id==id);if(ls('keepup')!='1'&&w&&off(w)&&!(R&&R.w.id==id)){await del('text',id);w.offline=false;await put('works',w)}}}if(!R&&$('#res')&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))draw();if(c)await ghCols();stat('Synced '+new Date().toLocaleTimeString())}catch(e){ids.forEach(i=>dirty.add(i));cd=cd||c;stat('Sync failed ('+e.message+'). It will retry after your next change.')}}
async function ghList(){const g=GH();try{const t=await gh('git/trees/'+encodeURIComponent(g.branch||'main')+'?recursive=1');if(t&&!t.truncated)return t.tree.filter(x=>x.type=='blob'&&/^works\/[^/]+\.json$/.test(x.path)).map(x=>({name:x.path.slice(6),sha:x.sha}))}catch(e){}

async function ghGet(id){const j=await gh('works/'+id+'.json',{raw:true});if(!j)throw new Error('not found on GitHub');return JSON.parse(j)}
async function ghIndex(drop){const g=GH(),ix=await gh('index.json'),raw=ix?await gh('index.json',{raw:true}):'[]',names=new Set((await ghList()).map(f=>f.name)),mm={};
 JSON.parse(raw).forEach(m=>mm[m.id]=m);W.forEach(w=>{if(names.has(w.id+'.json')){const{q,...r}=w;mm[w.id]={...r,last:0,offline:false}}});if(drop)delete mm[drop];

async function ghRemove(id){const g=GH(),f=(await ghList()).find(x=>x.name==id+'.json');if(f)await gh('works/'+f.name,{method:'DELETE',body:{message:'Delete work',sha:f.sha,branch:g.branch||'main'}});await ghIndex(id);

const normRepo=x=>x.trim().replace(/^https?:\/\/github\.com\//i,'').replace(/\.git$/i,'').replace(/\/+$/,'');
async function ghCheck(){const g=GH(),H={Authorization:'Bearer '+g.token,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
 if(!/^[\w.-]+\/[\w.-]+$/.test(g.repo||''))throw new Error('the repo must be written as owner/repo, for example juliamsheehan/ArchiveOfMyOwn');

async function ghFill(todo){const total=todo.length,q=[...todo];let done=0,added=0;

  done++;stat(`Adding your library… ${done} of ${total}`);if(done%20==0){await load();if(!R&&!LOCKED&&$('#res'))list()}}};

async function ghOpen(quiet){const g=GH();if(!g||!g.token||ls('autopull')=='0'||LOCKED||(quiet&&R)||OPENING)return;OPENING=true;
 try{if(!quiet){stat('Checking GitHub…');await ghCheck()}const sig=()=>JSON.stringify([COLS,W.map(w=>w.id)]),b4=sig();let n=0,u=0;
  const fs=await ghList(),names=new Set(fs.map(f=>f.name));
  if(!quiet||fs.length!=+(ls('lastn')||-1)){
   const ixr=await gh('index.json',{raw:true}),ix=ixr?JSON.parse(ixr):[];
   for(const m of ix)if(names.has(m.id+'.json')&&!W.some(x=>x.id==m.id)){m.offline=false;m.last=0;m.added=m.added||Date.now();m.q=mkq(m);await put('works',m);n++}
   await load();for(const w of W)if(!off(w)&&!names.has(w.id+'.json'))await del('works',w.id);
   await load();const have=new Set(W.map(w=>w.id)),miss=fs.filter(f=>!have.has(f.name.replace(/\.json$/,'')));

   ls('lastn',fs.length)}
  const rs=JSON.parse(ls('rsha')||'{}'),map=JSON.parse(ls('syncmap')||'{}');
  for(const f of fs){const id=f.name.replace(/\.json$/,''),old=W.find(x=>x.id==id);if(!old||!off(old)||rs[id]==f.sha)continue;
   const t=await get('text',id);if(!t||map[id]!=await hs(JSON.stringify({meta:{...old,last:0},ch:t.ch})))continue;
   const j=JSON.parse(await gh('works/'+f.name,{raw:true}));j.meta.offline=true;j.meta.last=old.last||0;j.meta.added=old.added;
   await put('text',{id,ch:j.ch});await put('works',j.meta);map[id]=await hs(JSON.stringify({meta:{...j.meta,last:0},ch:j.ch}));rs[id]=f.sha;u++}
  ls('rsha',JSON.stringify(rs));ls('syncmap',JSON.stringify(map));
  {const c=await gh('collections.json',{raw:true});if(c){COLS=await all('cols');for(const x of mergeCols(COLS,JSON.parse(c)))await put('cols',x)}}
  let freed=0;if(ls('keepup')!='1'){const pins=new Set(JSON.parse(ls('pins')||'[]')),sh={};fs.forEach(f=>sh[f.name]=f.sha);
   for(const w of W.filter(w=>off(w)&&!pins.has(w.id)&&!(R&&R.w.id==w.id)&&sh[w.id+'.json'])){if(LOCKED)break;const t=await get('text',w.id);if(!t)continue;
    if(await gsha(JSON.stringify({meta:{...w,last:0},ch:t.ch}))==sh[w.id+'.json']){await del('text',w.id);w.offline=false;await put('works',w);if(++freed%10==0)stat(`Freeing space on this device… ${freed}`)}}}

async function clearDL(){const g=GH();if(!g||!g.token)throw new Error('connect GitHub sync first, so removed works can be streamed again');
 let names;try{names=new Set((await ghList()).map(f=>f.name))}catch(e){throw new Error('couldn’t confirm your works are on GitHub ('+e.message+')')}
